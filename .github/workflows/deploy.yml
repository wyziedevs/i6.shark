name: Deploy

# Push to main = deploy to the proxy server over SSH (deploy/update.sh keeps the
# server's own settings, checks the new build and rolls back on failure).
# Needs repo secrets I6_VPS_HOST, I6_VPS_USER, I6_VPS_SSH_KEY, written once by
# deploy/setup_ci.py; until they exist every run is skipped. Optional secret
# I6_SHARED_SECRET sets the proxy's shared secret. This repo is public: the
# scripts never print secret values.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.I6_VPS_SSH_KEY != '' && secrets.I6_VPS_HOST != '' }}
    steps:
      - name: Skip until deploy/setup_ci.py has run
        if: env.READY != 'true'
        run: echo "::notice::I6_VPS_* secrets are not set; run deploy/setup_ci.py once. Nothing deployed."

      - name: Update, rebuild, check
        if: env.READY == 'true'
        uses: appleboy/ssh-action@v1
        env:
          I6_SHARED_SECRET: ${{ secrets.I6_SHARED_SECRET }}
        with:
          host: ${{ secrets.I6_VPS_HOST }}
          username: ${{ secrets.I6_VPS_USER }}
          key: ${{ secrets.I6_VPS_SSH_KEY }}
          envs: I6_SHARED_SECRET
          script_stop: true
          script: |
            set -euo pipefail
            UNIT=$(systemctl list-unit-files --no-pager --type=service | awk 'tolower($1) ~ /shark/ {print $1; exit}')
            [ -n "$UNIT" ] || { echo "no i6.shark systemd service on this server"; exit 1; }
            DIR=$(systemctl show "$UNIT" -p WorkingDirectory --value)
            [ -n "$DIR" ] || DIR=/opt/i6.shark
            [ -d "$DIR/.git" ] || { echo "$DIR is not a git checkout"; exit 1; }
            git -C "$DIR" fetch -q origin main
            git -C "$DIR" show origin/main:deploy/update.sh > /tmp/i6shark-update.sh
            bash /tmp/i6shark-update.sh "$DIR" "$UNIT"
            rm -f /tmp/i6shark-update.sh
